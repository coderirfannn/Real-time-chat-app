services:
  - type: web
    name: chatlock-server
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: APP_NAME
        value: ChatLock
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: chatlock
      - key: MONGODB_MAX_POOL_SIZE
        value: '50'
      - key: MONGODB_MIN_POOL_SIZE
        value: '5'
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        value: 'true'
      - key: REDIS_KEY_PREFIX
        value: 'chatlock:prod:'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SOCKET_PORT
        value: 10000
      - key: SOCKET_PATH
        value: /socket.io
      - key: SOCKET_PING_TIMEOUT
        value: 20000
      - key: SOCKET_PING_INTERVAL
        value: 25000
      - key: SOCKET_CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: RATE_LIMIT_MAX_REQUESTS
        value: '100'
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: '10'
      - key: SESSION_SECRET
        generateValue: true
      - key: HELMET_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: 'false'
      - key: JOB_CONCURRENCY
        value: '5'
      - key: ENABLE_VOICE_CALLS
        value: 'false'
      - key: ENABLE_END_TO_END_ENCRYPTION
        value: 'false'
      - key: ENABLE_MESSAGE_REACTIONS
        value: 'true'
